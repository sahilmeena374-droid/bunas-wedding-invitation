name: Import wedding invitation source
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-source.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore app source
        run: |
          curl -fL "https://d2ol7oe51mr4n9.cloudfront.net/user_3KK0gqyHpfx5WXotxC2nbGxPORI/1abcd5f0-9701-47d5-b878-228f2dd2ce38.gz" -o /tmp/bunas-source.tar.gz
          tar -xzf /tmp/bunas-source.tar.gz -C .
          test -f app/package.json
      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Import wedding invitation app source"
          git push
